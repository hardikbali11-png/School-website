<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - New Modern High School Patrara</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172554;
    }

    header {
      background: #174a7c;
      color: white;
      padding: 20px;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      max-width: 650px;
      margin: 100px auto;
      background: white;
      padding: 35px;
      border-radius: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 17px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 17px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: #174a7c;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    button:active {
      opacity: 0.8;
    }

    #message {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #c62828;
    }

    #adminPanel {
      display: none;
    }

    .admission {
      background: #f8fafc;
      padding: 20px;
      margin: 15px 0;
      border-radius: 15px;
      border-left: 5px solid #174a7c;
    }

    .logout {
      background: #c62828;
      margin-bottom: 20px;
    }

    .delete {
      background: #b91c1c;
      font-size: 15px;
      padding: 10px;
    }

    @media(max-width: 700px) {
      .container {
        margin: 50px 10px;
        padding: 25px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header>
  🏫 New Modern High School Patrara
</header>

<div class="container">

  <div id="loginBox">
    <h1>🔐 Admin Login</h1>
    <p>Login to view admission enquiries.</p>

    <input
      type="email"
      id="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">Login</button>

    <button
      onclick="resetPassword()"
      style="background:#64748b; font-size:16px;"
    >
      Forgot Password?
    </button>

    <div id="message"></div>
  </div>


  <div id="adminPanel">

    <h1>📋 Admission Enquiries</h1>

    <button class="logout" onclick="logout()">Logout</button>

    <input
      type="text"
      id="search"
      placeholder="Search student, parent, class, phone..."
      oninput="filterAdmissions()"
    >

    <div id="admissionList">
      Loading...
    </div>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    signOut
  }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getFirestore,
    collection,
    getDocs,
    deleteDoc,
    doc
  }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  // FIREBASE CONFIG

  const firebaseConfig = {
    apiKey: "AIzaSyAhKbPnZx8LKU5V2X6DaRwXMIX1GBd1w",
    authDomain: "new-modern-academy-patrara.firebaseapp.com",
    projectId: "new-modern-academy-patrara",
    storageBucket: "new-modern-academy-patrara.firebasestorage.app",
    messagingSenderId: "345409481080",
    appId: "1:345409481080:web:81d9237018c6d716d1c08d",
    measurementId: "G-EX84K79YJN"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  let allAdmissions = [];


  // LOGIN

  window.login = async function() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    message.style.color = "#c62828";
    message.innerText = "Logging in...";

    if (!email || !password) {
      message.innerText =
        "Please enter email and password.";
      return;
    }

    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      message.style.color = "green";
      message.innerText = "Login successful!";

      document.getElementById("loginBox").style.display = "none";

      document.getElementById("adminPanel").style.display = "block";

      loadAdmissions();

    } catch (error) {

      console.error(error);

      message.style.color = "#c62828";

      message.innerHTML =
        "❌ Login failed<br><br>" +
        "Firebase error: <b>" +
        error.code +
        "</b><br><br>" +
        error.message;

    }

  };


  // PASSWORD RESET

  window.resetPassword = async function() {

    const email =
      document.getElementById("email").value.trim();

    const message =
      document.getElementById("message");

    if (!email) {

      message.style.color = "#c62828";

      message.innerText =
        "Pehle email enter karo.";

      return;
    }

    try {

      await sendPasswordResetEmail(
        auth,
        email
      );

      message.style.color = "green";

      message.innerText =
        "✅ Password reset email sent. Gmail inbox check karo.";

    } catch (error) {

      console.error(error);

      message.style.color = "#c62828";

      message.innerHTML =
        "❌ Reset failed<br><br>" +
        "Firebase error: <b>" +
        error.code +
        "</b><br><br>" +
        error.message;

    }

  };


  // LOAD ADMISSIONS

  async function loadAdmissions() {

    const list =
      document.getElementById("admissionList");

    list.innerHTML = "Loading...";

    try {

      const snapshot =
        await getDocs(
          collection(db, "admission")
        );

      allAdmissions = [];

      snapshot.forEach((item) => {

        allAdmissions.push({
          id: item.id,
          ...item.data()
        });

      });

      displayAdmissions(allAdmissions);

    } catch (error) {

      console.error(error);

      list.innerHTML =
        "❌ Could not load admission enquiries.<br><br>" +
        error.code;

    }

  }


  // DISPLAY

  function displayAdmissions(data) {

    const list =
      document.getElementById("admissionList");

    if (data.length === 0) {

      list.innerHTML =
        "<p>No admission enquiries found.</p>";

      return;
    }

    data.forEach((item
