<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel - New Modern High School Patrara</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #222;
    }

    .container {
      width: 94%;
      max-width: 1000px;
      margin: 30px auto;
    }

    .header {
      background: #0d47a1;
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .box h2 {
      margin-top: 0;
      color: #0d47a1;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 15px;
    }

    .login-btn {
      width: 100%;
      background: #0d47a1;
      color: white;
    }

    .login-btn:hover {
      background: #083579;
    }

    .reset-btn {
      width: 100%;
      background: #eeeeee;
      color: #333;
    }

    .logout-btn {
      background: #d32f2f;
      color: white;
      float: right;
      margin-top: 0;
    }

    .refresh-btn {
      background: #2e7d32;
      color: white;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .admin-top {
      overflow: hidden;
      margin-bottom: 15px;
    }

    .admin-top h2 {
      float: left;
      margin: 5px 0;
    }

    .search {
      margin-bottom: 20px;
    }

    .admission-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 15px;
      background: #fafafa;
    }

    .admission-card h3 {
      margin: 0 0 12px;
      color: #0d47a1;
    }

    .admission-card p {
      margin: 7px 0;
      line-height: 1.5;
    }

    .delete-btn {
      background: #d32f2f;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #555;
    }

    .success {
      color: green;
    }

    .error {
      color: #c62828;
    }

    .clear {
      clear: both;
    }

    @media (max-width: 600px) {
      .container {
        width: 94%;
        margin: 15px auto;
      }

      .box {
        padding: 18px;
      }

      .header h1 {
        font-size: 21px;
      }

      .admin-top h2 {
        float: none;
        margin-bottom: 10px;
      }

      .logout-btn {
        float: none;
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <h1>New Modern High School Patrara</h1>
      <p>Admin Panel</p>
    </div>


    <!-- LOGIN BOX -->
    <div class="box" id="loginBox">

      <h2>Admin Login</h2>

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        autocomplete="email"
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >

      <button class="login-btn" id="loginBtn">
        Login
      </button>

      <button class="reset-btn" id="resetBtn">
        Forgot Password
      </button>

      <div class="message" id="message"></div>

    </div>


    <!-- ADMIN PANEL -->
    <div class="box" id="adminPanel" style="display:none;">

      <div class="admin-top">

        <h2>Admission Enquiries</h2>

        <button class="logout-btn" id="logoutBtn">
          Logout
        </button>

        <div class="clear"></div>

      </div>


      <!-- SEARCH -->
      <div class="search">

        <label for="searchInput">
          Search Admission
        </label>

        <input
          type="text"
          id="searchInput"
          placeholder="Search by student name, class, parent or phone..."
        >

      </div>


      <button class="refresh-btn" id="refreshBtn">
        Refresh Admissions
      </button>

      <div id="admissionList" style="margin-top:20px;">
        <div class="loading">
          Loading...
        </div>
      </div>

    </div>

  </div>


  <!-- FIREBASE COMPAT LIBRARIES -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>


  <script>

    // ==========================================
    // FIREBASE CONFIGURATION
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyAhKbPnZx8LKUV52VX26DaRwXwMXIGBd1w",
      authDomain: "new-modern-academy-patrara.firebaseapp.com",
      projectId: "new-modern-academy-patrara",
      storageBucket: "new-modern-academy-patrara.firebasestorage.app",
      messagingSenderId: "345409481080",
      appId: "1:345409481080:web:81d9237018c6d716d1c08d",
      measurementId: "G-EX84K79YJN"
    };


    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    const db = firebase.firestore();


    // ==========================================
    // VARIABLES
    // ==========================================

    let allAdmissions = [];


    // ==========================================
    // ELEMENTS
    // ==========================================

    const loginBox =
      document.getElementById("loginBox");

    const adminPanel =
      document.getElementById("adminPanel");

    const loginBtn =
      document.getElementById("loginBtn");

    const resetBtn =
      document.getElementById("resetBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const refreshBtn =
      document.getElementById("refreshBtn");

    const searchInput =
      document.getElementById("searchInput");

    const message =
      document.getElementById("message");

    const admissionList =
      document.getElementById("admissionList");


    // ==========================================
    // LOGIN
    // ==========================================

    loginBtn.addEventListener("click", async function() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      message.className = "message";
      message.style.color = "#555";
      message.innerText = "Logging in...";


      if (!email || !password) {

        message.className = "message error";
        message.innerText =
          "Please enter email and password.";

        return;
      }


      try {

        await auth.signInWithEmailAndPassword(
          email,
          password
        );


        message.className = "message success";

        message.innerText =
          "Login successful!";


        loginBox.style.display = "none";

        adminPanel.style.display = "block";


        await loadAdmissions();

      }

      catch (error) {

        console.error(error);

        message.className = "message error";

        message.innerHTML =
          "❌ Login failed.<br><br>" +
          "Firebase error: <b>" +
          escapeHtml(error.code || "") +
          "</b><br><br>" +
          escapeHtml(error.message || "");

      }

    });


    // ==========================================
    // FORGOT PASSWORD
    // ==========================================

    resetBtn.addEventListener("click", async function() {

      const email =
        document.getElementById("email").value.trim();


      message.className = "message";
      message.innerText = "";


      if (!email) {

        message.className = "message error";

        message.innerText =
          "Pehle email enter karo.";

        return;
      }


      message.style.color = "#555";

      message.innerText =
        "Sending password reset email...";


      try {

        await auth.sendPasswordResetEmail(email);


        message.className = "message success";

        message.innerText =
          "✅ Password reset email sent. " +
          "Gmail inbox check karo.";

      }

      catch (error) {

        console.error(error);

        message.className = "message error";

        message.innerHTML =
          "❌ Reset failed.<br><br>" +
          "Firebase error: <b>" +
          escapeHtml(error.code || "") +
          "</b><br><br>" +
          escapeHtml(error.message || "");

      }

    });


    // ==========================================
    // LOGOUT
    // ==========================================

    logoutBtn.addEventListener("click", async function() {

      try {

        await auth.signOut();

        adminPanel.style.display = "none";

        loginBox.style.display = "block";

        document.getElementById("password").value = "";

        message.className = "message";

        message.innerText =
          "You have been logged out.";

      }

      catch (error) {

        console.error(error);

      }

    });


    // ==========================================
    // REFRESH
    // ==========================================

    refreshBtn.addEventListener("click", function() {

      loadAdmissions();

    });


    // ==========================================
    // LOAD ADMISSIONS
    // ==========================================

    async function loadAdmissions() {

      admissionList.innerHTML =
        '<div class="loading">Loading admissions...</div>';


      try {

        const snapshot =
          await db.collection("admission").get();


        allAdmissions = [];


        snapshot.forEach(function(doc) {

          allAdmissions.push({

            id: doc.id,

            ...doc.data()

          });

        });


        displayAdmissions(allAdmissions);

      }

      catch (error) {

        console.error(error);


        admissionList.innerHTML =
          '<div class="message error">' +
          '❌ Could not load admission enquiries.<br><br>' +
          'Firebase error: <b>' +
          escapeHtml(error.code || "") +
          '</b><br><br>' +
          escapeHtml(error.message || "") +
          '</div>';

      }

    }


    // ==========================================
    // DISPLAY ADMISSIONS
    // ==========================================

    function displayAdmissions(data) {

      if (!data || data.length === 0) {

        admissionList.innerHTML =
          '<div class="empty">' +
          '<p>No admission enquiries found.</p>' +
          '</div>';

        return;

      }


      admissionList.innerHTML = "";


      data.forEach(function(item, index) {

        const card =
          document.createElement("div");

        card.className =
          "admission-card";


        const studentName =
          item.studentName || "Not provided";

        const className =
          item.className || "Not provided";

        const parentName =
          item.parentName || "Not provided";

        const phone =
          item.phone || "Not provided";

        const address =
          item.address || "Not provided";


        card.innerHTML = `

          <h3>
            ${index + 1}. ${escapeHtml(studentName)}
          </h3>

          <p>
            <strong>Class:</strong>
            ${escapeHtml(className)}
          </p>

          <p>
            <strong>Parent / Guardian:</strong>
            ${escapeHtml(parentName)}
          </p>

          <p>
            <strong>Phone:</strong>
            ${escapeHtml(phone)}
          </p>

          <p>
            <strong>Address:</strong>
            ${escapeHtml(address)}
          </p>

          <button
            class="delete-btn"
            data-id="${escapeHtml(item.id)}"
          >
            Delete
          </button>

        `;


        const deleteButton =
          card.querySelector(".delete-btn");


        deleteButton.addEventListener(
          "click",
          function() {

            deleteAdmission(item.id);

          }
        );


        admissionList.appendChild(card);

      });

    }


    // ==========================================
    // DELETE ADMISSION
    // ==========================================

    async function deleteAdmission(id) {

      const confirmDelete =
        confirm(
          "Kya aap is admission enquiry ko delete karna chahte ho?"
        );


      if (!confirmDelete) {

        return;

      }


      try {

        await db
          .collection("admission")
          .doc(id)
          .delete();


        alert(
          "Admission enquiry deleted successfully."
        );


        await loadAdmissions();

      }

      catch (error) {

        console.error(error);

        alert(
          "Delete failed: " +
          (error.message || error.code)
        );

      }

    }


    // ==========================================
    // SEARCH
    // ==========================================

    searchInput.addEventListener(
      "input",
      function() {

        const search =
          searchInput.value
            .trim()
            .toLowerCase();


        if (!search) {

          displayAdmissions(allAdmissions);

          return;

        }


        const filtered =
          allAdmissions.filter(function(item) {

            const student =
              String(item.studentName || "")
                .toLowerCase();

            const className =
              String(item.className || "")
                .toLowerCase();

            const parent =
              String(item.parentName || "")
                .toLowerCase();

            const phone =
              String(item.phone || "")
                .toLowerCase();

            const address =
              String(item.address || "")
                .toLowerCase();


            return (
              student.includes(search) ||
              className.includes(search) ||
              parent.includes(search) ||
              phone.includes(search) ||
              address.includes(search)
            );

          });


        displayAdmissions(filtered);

      }
    );


    // ==========================================
    // AUTH STATE
    // ==========================================

    auth.onAuthStateChanged(function(user) {

      if (user) {

        loginBox.style.display = "none";

        adminPanel.style.display = "block";

        loadAdmissions();

      }

      else {

        loginBox.style.display = "block";

        adminPanel.style.display = "none";

      }

    });


    // ==========================================
    // SECURITY: HTML ESCAPE
    // ==========================================

    function escapeHtml(value) {

      return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
